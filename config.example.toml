# Vaani example configuration — copy to ~/.config/vaani/config.toml
# Schema version 1. Unknown keys are ignored; invalid values fall back to defaults.
schema_version = 1

[general]
# economy = exit worker + UI when idle (lowest inactive RAM, default)
# balanced/ready = retain supported sidecars for server_idle_secs after use
residency_profile = "economy"
review_before_insertion = false
unicode_output = true
# live-dictation commit cadence, seconds (1-10): lower = more responsive
# typing, more inference cost + clipboard churn
live_chunk_secs = 1
# hands-free finish: transcribe after N seconds of silence following speech
# (1-10). 0 disables (manual stop only). SUPER+H mid-session discards.
auto_stop_secs = 1
# Primary toggle shortcut shown by the desktop setup/settings app. Hyprland
# bindings remain app-owned and are regenerated only when the user asks.
shortcut = "SUPER+ALT+SPACE"
onboarding_complete = false

[audio]
# Empty = PipeWire default source at session start. Otherwise a stable
# device property (never a transient numeric node id).
device_selector = ""
worker_threads = 4
max_secs = 120

[recognition]
# tiny | base | base.en | small | cozy | v5 — multilingual base default; base.en English-only;
# small accuracy-focused; cozy = local fine-tuned faster-whisper CT2 dir
# (~/.local/share/vaani/models/cozy, from Cozy stt-finetune), best for your
# voice + Indian English. cozy and v5 need the faster-whisper sidecar python;
# v5 resolves to the local v5-stt-whisper-v5-supervised-200-ct2 directory.
model = "base"
# fast model for the live preview ticks (keep a whisper.cpp one here: the
# fine-tuned CT2 one-shot loads ~1-2 s per call; resident server answers in ~0.3 s)
live_model = "base"
# resident faster-whisper server idle TTL, seconds (0 disables: one-shot).
# While resident, streaming chunks skip the model reload (~0.3 s vs ~4.5 s).
server_idle_secs = 60
# en | hi | bn — explicit; short utterances must not rely on auto-detect
language = "en"
translate_to_en = false
# cpu (default) | cuda (only with a user-selected GPU worker build)
device = "cpu"

[insertion]
# automatic (default: type into the focused app after focus/policy checks)
# | copy-only (keep transcript on clipboard + confirmation popup)
# | review (hold for explicit copy)
mode = "automatic"
clipboard_serve_secs = 30
# pending final text expiry, in-memory only, seconds
pending_expiry_secs = 300
# per-application overrides: substring of Hyprland class -> mode
[insertion.app_overrides]
foot = "copy-only"
kitty = "copy-only"
Alacritty = "copy-only"

[cleanup]
# Every non-empty final transcript is sent to the local source-grounded
# formatter. Raw text is retained only if that formatter fails or is rejected
# by the safety guard.
vocabulary = []
# Path to local formatter model dir (e.g. output/base-model from training/cleanup-llm).
# If empty, daemon auto-detects next to the binary.
model_path = ""
# Path to the local LLM LoRA adapter dir (e.g. output/llm-v1).
# Empty keeps the legacy dpo-sft adapter next to model_path.
adapter_path = ""
# Path to vaani_inject.py. If empty, daemon looks beside the binary.
python_path = ""

[privacy]
save_history = false
hide_preview_on_sharing = false
