name: Publish Vaani release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Publish Android APK
    runs-on: ubuntu-24.04
    env:
      # Repository/organization secrets must point to files made available to
      # the runner (for example via an internal model-artifact step). The
      # workflow refuses to claim model assets when these are absent.
      ANDROID_STT_MODEL: ${{ secrets.ANDROID_STT_MODEL }}
      ANDROID_FORMATTER_MODEL: ${{ secrets.ANDROID_FORMATTER_MODEL }}
      V6_TAGGER_MODEL: ${{ secrets.V6_TAGGER_MODEL }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the installable debug APK
        run: |
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vaani-Android-1.2.0-debug.apk"
      - name: Verify native runtimes
        run: |
          unzip -l dist/Vaani-Android-1.2.0-debug.apk | grep -q 'lib/arm64-v8a/libwhisper.so'
          unzip -l dist/Vaani-Android-1.2.0-debug.apk | grep -q 'lib/arm64-v8a/libllama.so'
      - name: Stage and verify model release assets
        if: ${{ env.ANDROID_STT_MODEL != '' && env.ANDROID_FORMATTER_MODEL != '' && env.V6_TAGGER_MODEL != '' }}
        run: |
          cd ..
          RELEASE_TAG="${GITHUB_REF_NAME}" \
          ANDROID_STT_MODEL="${ANDROID_STT_MODEL}" \
          ANDROID_FORMATTER_MODEL="${ANDROID_FORMATTER_MODEL}" \
          V6_TAGGER_MODEL="${V6_TAGGER_MODEL}" \
          tools/prepare-release-models.sh android/dist/models
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vaani ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: |
            android/dist/Vaani-Android-1.2.0-debug.apk
            android/dist/models/*
          body: |
            Install `Vaani-Android-1.2.0-debug.apk` on an arm64 Android device.

            This is an installable debug build for the Vaani 1.2.0 desktop/mobile integration milestone. Model packages are downloaded and verified by the app; they are not bundled in the APK.
