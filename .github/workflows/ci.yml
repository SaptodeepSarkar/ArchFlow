name: CI

# Runs the hermetic gate set (TESTS/ci.sh): workspace build + tests, shell
# syntax, and the gates that need no microphone, compositor, GPU or model
# server -- including gate 22, which drives the real daemon end-to-end against
# stub mic/STT/typing backends. The remaining gates are hardware gates and stay
# on the machine (`./TESTS/gate.sh` is 22/22 there) -- a CI runner cannot fake
# a mic, a Hyprland keypress, a GPU or real speech.
on:
  push:
    branches: [vaani-scaffold, main]
  pull_request:
    branches: [vaani-scaffold, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run hermetic gate set
        run: bash TESTS/ci.sh

      - name: Gate logs (on failure)
        if: failure()
        run: |
          for f in /tmp/ci-gate-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            tail -40 "$f"
          done

  gates-inventory:
    # Keeps the full board honest: every gate the machine runs must exist and
    # be wired into TESTS/gate.sh, so a gate can never quietly disappear.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Every listed gate exists and is executable
        run: |
          missing=0
          for n in $(seq -w 1 22); do
            case "$n" in
              01) f=TESTS/test_fixtures.py ;;
              22) f=TESTS/gates/gate-22-e2e.sh ;;
              *)  f="TESTS/gates/gate-$n.sh" ;;
            esac
            if [ ! -f "$f" ]; then echo "missing: $f"; missing=1; fi
            grep -qE "(^|['\"])$n\|" TESTS/gate.sh || { echo "gate $n not wired into TESTS/gate.sh"; missing=1; }
          done
          grep -q '19|formatter-pipeline' TESTS/gate.sh || { echo "gate 19 not wired"; missing=1; }
          grep -q '22|e2e-stubs' TESTS/gate.sh || { echo "gate 22 not wired"; missing=1; }
          exit "$missing"
