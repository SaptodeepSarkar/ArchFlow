# Model manifest — first-run choice precedes download. Weights are NEVER
# bundled in the package. Download to tmp, verify sha256, then rename.
# Sizes/memories are upstream estimates to display, not guarantees.
# Sources: https://huggingface.co/ggerganov/whisper.cpp
schema_version = 1
whisper_cpp_pin = "see native/worker/WHISPER_PIN"

[[model]]
