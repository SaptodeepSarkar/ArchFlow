# App-owned Hyprland include — managed by Vaani Settings.
# Add exactly one line to hyprland.conf:
#   source = ~/.config/hypr/vaani.conf
# The installer copies this file there; it never edits your config.
# No recording shortcuts are registered for the lock screen.

# Primary dictation shortcut selected in Vaani Settings.
bindd = SUPER, H, Toggle Vaani dictation, exec, vaani toggle
# Live dictation keeps a dedicated secondary chord.
bindd = SUPER ALT, H, Toggle Vaani live dictation, exec, vaani live-toggle
# Hold-to-talk (release semantics tested; falls back to toggle if unreliable)
bindd = SUPER ALT, V, Vaani hold-to-talk, exec, vaani start
binddr = SUPER ALT, V, Vaani hold release, exec, vaani stop
# Cancel active operation
bindd = SUPER ALT, Escape, Cancel Vaani operation, exec, vaani cancel
# Open settings
bindd = SUPER ALT, S, Open Vaani settings, exec, vaani-desktop app
# Copy pending final transcript (explicit recovery action)
bindd = SUPER ALT, C, Copy pending Vaani text, exec, vaani copy
# Manual finish: run final STT + cleanup, then save to clipboard without typing
bindd = SUPER, J, Finish Vaani to clipboard, exec, vaani stop
