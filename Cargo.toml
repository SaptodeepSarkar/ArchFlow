[workspace]
members = [
  "crates/vaani-core",
  "crates/vaanid",
  "crates/vaani-cli",
  "crates/vaani-worker",
  "crates/vaani-desktop",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
aes-gcm = "0.10"
base64 = "0.22"
flate2 = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
