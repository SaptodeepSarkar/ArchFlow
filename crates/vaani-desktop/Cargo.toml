[package]
name = "vaani-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "vaani_desktop"
path = "src/lib.rs"

[dependencies]
vaani-core = { path = "../vaani-core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
ureq = { version = "3.4.2", default-features = false, features = ["json", "native-tls"] }
keyring = "4.2.0"
rpassword = "7.5.4"

[[bin]]
name = "vaani-desktop"
path = "src/bin/vaani-desktop.rs"
