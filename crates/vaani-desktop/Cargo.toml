[package]
name = "vaani-desktop"
version = "1.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "vaani_desktop"
path = "src/lib.rs"

[dependencies]
vaani-core = { path = "../vaani-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15.3", default-features = false }

[[bin]]
name = "vaani-desktop"
path = "src/bin/vaani-desktop.rs"
